name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # a full run takes under a minute: a hung job stops here instead of after six hours
    timeout-minutes: 10
    strategy:
      # one failing cell does not cancel the others, so every system reports its own result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
        # one Windows cell: paths, line ends and links behave differently there
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: npm run format:check
      # the CLI and its tests need no dependencies, so they run on every Node from 18
      - run: npm test

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          UI_TEST_PARENT: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brandbook-screenshots
          path: ${{ runner.temp }}/aiall-ui-package-*/*.png
          if-no-files-found: ignore
